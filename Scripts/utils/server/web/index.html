<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPUMDkit Web Console</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar">
  <button class="iconbtn" id="sidebarBtn" aria-label="切换文件栏" title="切换文件栏">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <a href="https://gpumdkit.cn" target="_blank" rel="noopener">
    <img class="logo" id="logoImg" src="/logo_lateral.png" alt="GPUMDkit">
  </a>
  <span class="brand hidden" id="brandText"><span class="gpumd">GPUMD</span><span class="kit">kit</span></span>
  <nav class="crumb" id="crumb" aria-label="当前位置"></nav>
  <span class="grow"></span>
  <span class="conn" id="connWrap"><span class="conn-dot" id="connDot"></span><span id="connText">连接中...</span></span>
  <button class="iconbtn running-chip hidden" id="runningChip" aria-label="有命令正在运行，点击查看输出" title="命令运行中">运行中</button>
  <select id="refreshSel" class="sel" aria-label="刷新间隔" title="任务活跃时按所选间隔刷新；空闲时降为 60 秒检查">
    <option value="5">5s</option>
    <option value="15" selected>15s</option>
    <option value="30">30s</option>
    <option value="60">60s</option>
    <option value="0">关闭</option>
  </select>
  <button class="iconbtn" id="themeBtn" aria-label="切换浅色或深色主题" title="切换浅色或深色主题"></button>
  <button class="iconbtn" id="moreBtn" aria-label="更多" title="更多" aria-haspopup="menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
  </button>
  <div class="menu hidden" id="moreMenu" role="menu">
    <button role="menuitem" id="menuCommands">命令与输出</button>
    <button role="menuitem" id="menuRefresh">刷新目录</button>
  </div>
</div>

<div id="loginView" class="loginwrap hidden">
  <img class="loginlogo" id="loginLogo" src="/logo.png" alt="GPUMDkit" onerror="this.style.display='none'">
  <div class="logincard">
    <h2>登录</h2>
    <input type="password" id="pwInput" placeholder="密码" autocomplete="current-password">
    <button id="loginBtn" class="primary">登录</button>
    <p class="err" id="loginMsg"></p>
  </div>
</div>

<div id="appView" class="hidden">
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebarPanel" aria-label="文件栏">
      <input type="search" id="fileFilter" placeholder="搜索文件" aria-label="搜索文件">
      <div class="filelist" id="fileList"></div>
    </aside>
    <div class="content" id="contentCol">
      <div class="page">
        <header class="pagehead">
          <h1 id="dirTitle"></h1>
          <div class="pagestatus" id="statusLine"></div>
        </header>
        <div class="banner hidden" id="errorBanner">
          <span id="errorText"></span>
          <button class="ghost small" id="retryBtn">重试</button>
        </div>
        <div id="canvasRoot"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="lightbox">
  <div class="lbstage">
    <img id="lbImg" alt="">
    <div class="lbbar">
      <span class="mono lbtitle" id="lbTitle"></span>
      <span class="grow"></span>
      <span class="muted" id="lbCount"></span>
      <span class="lbhint">← → 切换 · Esc 关闭</span>
      <button class="ghost small" id="lbClose">关闭</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="previewLayer">
  <div class="sheet">
    <div class="sheet-head">
      <strong class="mono" id="pvTitle"></strong>
      <span class="muted" id="pvMeta"></span>
      <span class="badge warn hidden" id="pvDirty">未保存</span>
      <span class="grow"></span>
      <div class="seg hidden" id="pvModes"></div>
      <button class="ghost small hidden" id="pvEditBtn">编辑</button>
      <button class="iconbtn" id="pvClose" aria-label="关闭预览" title="关闭 (Esc)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="pvBody"></div>
    <p class="err" id="pvMsg"></p>
    <div class="confbar warn hidden" id="pvConfirm">
      <span>当前文件有未保存的修改。</span>
      <button class="ghost small" id="pvKeepBtn">继续编辑</button>
      <button class="danger small" id="pvDiscardBtn">放弃修改并打开</button>
    </div>
    <div class="confbar conflict hidden" id="pvConflict">
      <span>文件在磁盘上已被外部修改。</span>
      <button class="small" id="pvRereadBtn">重新读取</button>
      <button class="ghost small" id="pvKeepDraftBtn">保留我的修改</button>
      <button class="danger small" id="pvOverwriteBtn">覆盖磁盘</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="chartZoom">
  <div class="zoombox">
    <div class="zoombar">
      <strong>训练曲线</strong>
      <span class="grow"></span>
      <span class="scale-summary mono" id="zoomScale"></span>
      <button class="ghost small" id="zoomClose">关闭</button>
    </div>
    <canvas id="zoomCanvas"></canvas>
    <div class="lg-row" id="zoomLegend"></div>
  </div>
</div>

<aside class="drawer hidden" id="drawer" aria-label="命令与输出">
  <div class="drawer-head">
    <strong>命令与输出</strong>
    <span class="grow"></span>
    <div class="seg" id="drawerTabs">
      <button class="segbtn on" data-tab="output">输出</button>
      <button class="segbtn" data-tab="history">记录</button>
      <button class="segbtn" data-tab="terminal">命令</button>
    </div>
    <button class="iconbtn" id="drawerClose" aria-label="关闭抽屉" title="关闭">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div id="dOutput">
      <pre class="output" id="output"></pre>
      <p class="muted hidden" id="outTruncNote">输出在服务端截断至 64 KB</p>
    </div>
    <div id="dHistory" class="hidden"><div id="histList"></div></div>
    <div id="dTerminal" class="hidden">
      <div class="term">
        <div class="termnote">每条命令都在当前目录独立执行；export 等会话状态不会被保留；单条限时 120 秒</div>
        <pre class="term-out" id="termOut"></pre>
        <div class="term-in">
          <span class="tp">$</span>
          <input id="termInput" type="text" placeholder="输入命令后回车（内建 cd / clear / pwd）" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>
  </div>
</aside>

<div class="toast" id="toast"></div>
<div class="drawer-mask hidden" id="drawerMask"></div>
<script src="/app.js"></script>
</body>
</html>

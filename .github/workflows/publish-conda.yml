name: Publish Conda Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Conda package version to build
        required: true
        type: string
        default: '1.5.8'
      os:
        description: Runner platform to build
        required: true
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
        default: ubuntu-latest
      publish:
        description: Upload the manual build to Anaconda.org
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.os) || '["ubuntu-latest","macos-latest"]') }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          channels: conda-forge
          python-version: '3.11'

      - name: Set package version from tag or manual input
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$MANUAL_VERSION"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Expected version in X.Y.Z format, got: $VERSION"
              exit 1
            fi
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building gpumdkit ${VERSION}"

      - name: Build conda package
        run: |
          eval "$(conda shell.bash hook)"
          conda install conda-build anaconda-client -y
          conda build conda/ -c conda-forge --output-folder ${{ github.workspace }}/dist

      - name: Upload to Anaconda.org
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          eval "$(conda shell.bash hook)"
          pkg=$(find ${{ github.workspace }}/dist -name "gpumdkit-*.conda" | head -1)
          echo "Uploading: $pkg"
          anaconda upload --user gpumdkit "$pkg"
